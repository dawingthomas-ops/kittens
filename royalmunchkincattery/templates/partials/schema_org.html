{% load static %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Organization",
      "@id": "{{ SITE_URL }}/#organization",
      "name": "{{ SITE_NAME }}",
      "url": "{{ SITE_URL }}/",
      "logo": "{{ SITE_URL }}{% static 'img/icon-512.png' %}",
      "image": "{{ SITE_URL }}{% static 'img/og-default.png' %}",
      "email": "{{ site_settings.contact_email }}"{% if CONTACT_PHONE %},
      "telephone": "{{ CONTACT_PHONE }}"{% endif %}{% if site_settings.same_as %},
      "sameAs": [{% for u in site_settings.same_as %}"{{ u|escapejs }}"{% if not forloop.last %}, {% endif %}{% endfor %}]{% endif %}
    },
    {
      "@type": "WebSite",
      "@id": "{{ SITE_URL }}/#website",
      "name": "{{ SITE_NAME }}",
      "url": "{{ SITE_URL }}/",
      "publisher": {"@id": "{{ SITE_URL }}/#organization"},
      "potentialAction": {
        "@type": "SearchAction",
        "target": "{{ SITE_URL }}/kittens/?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    },
    {
      "@type": "PetStore",
      "@id": "{{ SITE_URL }}/#business",
      "name": "{{ SITE_NAME }}",
      "description": "{{ SITE_DEFAULT_DESCRIPTION|escapejs }}",
      "url": "{{ SITE_URL }}/",
      "image": "{{ SITE_URL }}{% static 'img/og-default.png' %}",
      "priceRange": "${{ MIN_PRICE }}-${{ MAX_PRICE }}",
      "areaServed": {"@type": "Country", "name": "United States"}{% if CONTACT_PHONE %},
      "telephone": "{{ CONTACT_PHONE }}"{% endif %}{% if site_settings.city %},
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "{{ site_settings.city|escapejs }}",
        "addressRegion": "{{ site_settings.state|escapejs }}",
        "addressCountry": "US"
      }{% endif %}
    }
  ]
}
</script>

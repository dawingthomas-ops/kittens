{% load static %}
<article class="post-card reveal">
  <div class="post-thumb" aria-hidden="true">
    {% if post.featured_image %}<img src="{{ post.featured_image.url }}" alt="" loading="lazy" width="640" height="360">{% else %}
    <img src="{% static 'img/cat-relaxed.jpg' %}" alt="" loading="lazy" width="1000" height="640">{% endif %}
  </div>
  <div class="post-body">
    <div class="post-meta"><span class="tag">{{ post.category }}</span><span>{{ post.reading_time }} min read</span></div>
    <h3><a href="{{ post.get_absolute_url }}">{{ post.title }}</a></h3>
    <p>{{ post.excerpt }}</p>
  </div>
</article>

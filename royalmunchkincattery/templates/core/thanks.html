{% extends "base.html" %}
{% block meta_robots %}noindex, nofollow{% endblock %}
{% block content %}
<section class="section"><div class="container narrow center">
  <svg class="big-check" viewBox="0 0 96 96" fill="none" stroke="#2B7A58" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="48" cy="48" r="46"/><path d="M28 50l14 14 27-30"/></svg>
  <h1 style="font-size:clamp(2.1rem,1.4rem + 3vw,3.4rem)">{{ title }}</h1>
  <p class="lede">{{ message }}</p>
  <div class="btn-row" style="justify-content:center;margin-top:1.6rem"><a class="btn btn-primary" href="{% url 'kittens:list' %}">Browse kittens</a><a class="btn btn-ghost" href="{% url 'core:journal_list' %}">Read the journal</a></div>
</div></section>
{% endblock %}
